<title>Pocket Groovebox</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;color:#ece9e2;
  background:radial-gradient(900px 600px at 50% 0%,#1d1e25 0%,#0c0c0f 70%) #0c0c0f;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.card{width:100%;max-width:380px;padding:28px 26px 22px;border-radius:18px;background:#141519;border:1px solid #26272c;
  box-shadow:0 30px 60px rgba(0,0,0,.45)}
.leds{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:0 0 22px}
.leds i{aspect-ratio:1;border-radius:3px;background:#2a2a2e;animation:blink 2.4s infinite}
@keyframes blink{0%,100%{background:#2a2a2e;box-shadow:none}8%{background:var(--c);box-shadow:0 0 12px 2px var(--c)}30%{background:#2a2a2e;box-shadow:none}}
h1{margin:0 0 4px;font-size:21px;font-weight:650}
p{margin:0 0 20px;color:#94908a}
form{display:flex;gap:8px}
input[type=password]{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid #33343a;background:#0f1013;color:#fff;font-size:16px}
input[type=password]:focus{outline:2px solid #ffc83d;outline-offset:1px;border-color:transparent}
button{padding:11px 16px;border:0;border-radius:10px;background:#ffc83d;color:#1a1400;font-weight:650;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
label{display:flex;gap:8px;align-items:center;margin-top:12px;color:#94908a;font-size:13.5px}
#err{min-height:1.5em;margin:10px 0 0;color:#ff8a7a;font-size:14px}
</style>
</head>

const KEY = 'pgb.pw';
const leds = document.querySelector('.leds');
const cols = ['#ff4a26','#ffc428','#28d2ff','#cd50ff'];
for (let i = 0; i < 16; i++) { const e = document.createElement('i'); e.style.setProperty('--c', cols[(i / 4) | 0]); e.style.animationDelay = (i * 0.15) + 's'; leds.appendChild(e); }

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
const store = { get(){ try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v){ try { localStorage.setItem(KEY, v); } catch (e) {} }, del(){ try { localStorage.removeItem(KEY); } catch (e) {} } };

const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'),
      err = document.getElementById('err'), rem = document.getElementById('rem');
if (!window.crypto || !crypto.subtle) { err.textContent = 'This browser can’t open the page (needs HTTPS and a modern browser).'; }

f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = '…';
  try {
    const html = await decrypt(pw.value);
    if (rem.checked) store.set(pw.value); else store.del();
    show(html);
  } catch (x) {
    err.textContent = 'Wrong password. Try again.'; go.disabled = false; go.textContent = 'Open'; pw.select();
  }
});

const saved = store.get();
if (saved) { decrypt(saved).then(show).catch(() => { store.del(); pw.focus(); }); }
else pw.focus();
})();
